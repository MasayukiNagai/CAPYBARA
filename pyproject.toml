[project]
name = "capybara"
version = "0.1.0"
description = "CAPYBARA: Count And Profile Y-net for Base-resolution Attribution, Regulatory design, and Allelic effect prediction."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0",
]

[project.optional-dependencies]
train = [
    "numpy>=2.4.4",
    "pyyaml>=6.0.3",
    "pybigtools>=0.3.0",
    "pyfaidx>=0.9.0.4",
    "scipy>=1.17.1",
]
atac = [
    "numpy>=2.4.4",
    "pysam>=0.22",
    "pyyaml>=6.0.3",
    "pybigtools>=0.3.0",
    "pyfaidx>=0.9.0.4",
    "scipy>=1.17.1",
]
procap = [
    "matplotlib>=3.10.9",
    "notebook>=7.5.6",
    "numpy>=2.4.4",
    "pyyaml>=6.0.3",
    "pybigtools>=0.3.0",
    "pyfaidx>=0.9.0.4",
    "scipy>=1.17.1",
    "tqdm>=4.67.3",
    "wandb>=0.26.1",
]
# Tier-B interpretation (attribution / contribution scoring). TF-MoDISco itself
# runs inside the ChromBPNet container, so it is NOT listed here.
interpret = [
    "tangermeme>=0.4.0",  # DeepLIFT/DeepSHAP engine (bias model)
    "captum>=0.7.0",      # GradientShap engine (nobias / attention model)
    "h5py>=3.11.0",       # write ChromBPNet's interpretation .h5 schema
    "pyfaidx>=0.9.0.4",
    "tqdm>=4.67.3",
]

[tool.ruff]
line-length = 100

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
