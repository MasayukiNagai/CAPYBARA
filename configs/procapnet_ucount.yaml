project: PRO-cap
monitor: valid_loss
mode: min

model:
  model_type: ucount
  n_filters: 512
  n_layers: 8
  n_outputs: 2
  trimming: 557
  count_head:
    conv_hidden_dims: []
    mlp_hidden_dims: [64]
    global_pool: avg
    dropout: 0.1
    activation: gelu
    mlp_norm_type: layer

dataset:
  input_length: 2114
  output_length: 1000
  max_jitter: 200
  reverse_complement: true
  use_dnase: true
  source_fracs: [0.875, 0.125]
  use_unmappability_mask: true
  seed: 0

train:
  batch_size: 32
  learning_rate: 0.0005
  profile_loss_fn: MNLLLoss
  count_loss_fn: log1pMSELoss
  counts_weight: 100.0
  max_epochs: 500
  validation_iter: 100
  precision: 32

early_stopping:
  patience: 10

checkpoint:
  save_top_k: 1
  filename: "{epoch:02d}-{valid_loss:.2f}"

dataloader:
  num_workers: 4
  prefetch_factor: 2
  pin_memory: true
  persistent_workers: true

lr_scheduler:
  scheduler_name:
  scheduler_kwargs:
  lr_scheduler_kwargs:

wandb:
  enabled: true
  project: capybara-procap
  entity:
  mode: online
  tags: []
  group:
  name:
  notes:
