model:
  input_channels: 4
  input_length: 2048
  output_length: 1000
  dna_embedder_channels: 64
  num_groups: 8
  encoder_channels: [128, 192, 256]
  pool_size: 2
  decoder_channels: [256, 192, 128, 128]
  output_embedder_channels: 128
  embedding_projector:
    enabled: true
  norm_type: batch
  activation: gelu
  dropout: 0.1

  profile_head:
    source: decoder
    num_outputs: 1      # unstranded ATAC-seq
    kernel_size: 75

  count_head:
    type: ynet
    source: bottleneck
    conv_hidden_dims: [128, 64]
    mlp_hidden_dims: [64]
    kernel_size: 5
    pool_size: 2
    adaptive_pool_size: 4
    dropout: 0.1
    norm_type: batch
    mlp_norm_type: layer

  bottleneck:
    type: hybrid_attention
    depth: 2
    kernel_size: 5
    dropout: 0.1
    norm_type: batch
    activation: gelu
    num_heads: 4
    attn_dropout: 0.1
    mlp_ratio: 2.0


dataset:
  input_length: 2048
  output_length: 1000
  max_jitter: 200
  reverse_complement: true
  use_unmappability_mask: false
  seed: null

train:
  batch_size: 64
  learning_rate: 0.001
  profile_loss_fn: MNLLLoss
  count_loss_fn: log1pMSELoss
  counts_weight: 100.0
  max_epochs: 200
  validation_iter: null
  precision: 32

early_stopping:
  patience: 20

dataloader:
  num_workers: 4
  prefetch_factor: 2
  pin_memory: true
  persistent_workers: true

lr_scheduler:
  scheduler_name: ReduceLROnPlateau
  scheduler_kwargs:
    mode: min
    factor: 0.5
    patience: 9
    min_lr: 1.0e-6

wandb:
  enabled: true
  project: capybara-atac
